services:
  etcd:
    image: docker.io/bitnamilegacy/etcd:3.5
    container_name: etcd-development
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://localhost:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    volumes:
      - etcd_data:/bitnami/etcd
  
  etcd-workbench:
    image: tzfun/etcd-workbench:latest
    container_name: etcd-workbench
    restart: unless-stopped
    ports:
      - "8002:8002"
    # depends_on:
    #   etcd:
    #     condition: service_healthy

  balances_retriever:
    container_name: balances_retriever
    build:
      context: .
      dockerfile: arbitrary_bot_ecosystem/src/balances_retriever/Dockerfile
    environment:
        # ETCD
      - ETCD_URL=${ETCD_URL}
      - ETCD_PORT=${ETCD_PORT}
      - ETCD_PUT_TIMEOUT=${ETCD_PUT_TIMEOUT}

        # HUOBI
      - HUOBI_ACCESS_KEY=${HUOBI_ACCESS_KEY}
      - HUOBI_SECRET_KEY=${HUOBI_SECRET_KEY}
      - HUOBI_ACCOUNT_ID=${HUOBI_ACCOUNT_ID}
        
        # BITCOM
      - BITCOM_ACCESS_KEY=${BITCOM_ACCESS_KEY}
      - BITCOM_SECRET_KEY=${BITCOM_SECRET_KEY}
        
        # EXMO
      - EXMO_ACCESS_KEY=${EXMO_ACCESS_KEY}
      - EXMO_SECRET_KEY=${EXMO_SECRET_KEY}
        
        # OKX
      - OKX_ACCESS_KEY=${OKX_ACCESS_KEY}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
        
        # MEXC
      - MEXC_ACCESS_KEY=${MEXC_ACCESS_KEY}
      - MEXC_SECRET_KEY=${MEXC_SECRET_KEY}
    # depends_on:
    #   etcd:
    #     condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  data_retriever:
    container_name: data_retriever
    build:
      context: .
      dockerfile: arbitrary_bot_ecosystem/src/data_retriever/Dockerfile
    environment:
        # ETCD
      - ETCD_URL=${ETCD_URL}
      - ETCD_PORT=${ETCD_PORT}
      - ETCD_PUT_TIMEOUT=${ETCD_PUT_TIMEOUT}
    # depends_on:
    #   etcd:
    #     condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
  arbitrary_bot:
    container_name: arbitrary_bot
    build:
      context: .
      dockerfile: arbitrary_bot_ecosystem/src/arbitrary_bot/Dockerfile
    environment:
        # ETCD
      - ETCD_URL=${ETCD_URL}
      - ETCD_PORT=${ETCD_PORT}

      - ETCD_ARBITRARY_KEY=symbols/TONUSDT/arbitrage
      - ETCD_PREFERENCES_KEY=user/preferences
      - ETCD_BALANCE_KEY=user/balances
      - ETCD_SYMBOLS_KEY=user/market_symbols

        # HUOBI
      - HUOBI_ACCESS_KEY=${HUOBI_ACCESS_KEY}
      - HUOBI_SECRET_KEY=${HUOBI_SECRET_KEY}
      - HUOBI_ACCOUNT_ID=${HUOBI_ACCOUNT_ID}
        
        # BITCOM
      - BITCOM_ACCESS_KEY=${BITCOM_ACCESS_KEY}
      - BITCOM_SECRET_KEY=${BITCOM_SECRET_KEY}
        
        # EXMO
      - EXMO_ACCESS_KEY=${EXMO_ACCESS_KEY}
      - EXMO_SECRET_KEY=${EXMO_SECRET_KEY}
        
        # OKX
      - OKX_ACCESS_KEY=${OKX_ACCESS_KEY}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
        
        # MEXC
      - MEXC_ACCESS_KEY=${MEXC_ACCESS_KEY}
      - MEXC_SECRET_KEY=${MEXC_SECRET_KEY}
    # depends_on:
    #   etcd:
    #     condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  etcd_data:
    driver: local
